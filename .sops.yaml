# SOPS rules for node secrets. Encrypted files live in the repo and are
# decrypted on the node with the age private key at ~/.config/sops/age/keys.txt
# (deploy it out-of-band; never commit it).
#
#  - Caddy host config (domain/ACME/Cloudflare token) → ~/caddy/.env
#  - Pi-hole custom DNS records (internal hostnames → private IPs)
#  - Pi-hole host secrets (admin password, TZ) → ~/pihole/.env
#  - Beszel host secrets (agent KEY/TOKEN) → ~/beszel/.env
#  - restic host secrets (repo password, B2 keys, repo paths) → /etc/restic/restic.env
creation_rules:
  - path_regex: ctdev/component/configs/caddy/hosts/.*\.sops\.env$
    age: age1uer0729xtqvedwv6n7r2e04pyqahutv82annjmqa5uh68aezgg8qz64tga
  - path_regex: ctdev/component/configs/pihole/hosts/.*\.sops\.json$
    age: age1uer0729xtqvedwv6n7r2e04pyqahutv82annjmqa5uh68aezgg8qz64tga
  - path_regex: ctdev/component/configs/pihole/hosts/.*\.sops\.env$
    age: age1uer0729xtqvedwv6n7r2e04pyqahutv82annjmqa5uh68aezgg8qz64tga
  - path_regex: ctdev/component/configs/beszel/hosts/.*\.sops\.env$
    age: age1uer0729xtqvedwv6n7r2e04pyqahutv82annjmqa5uh68aezgg8qz64tga
  - path_regex: ctdev/component/configs/restic/hosts/.*\.sops\.env$
    age: age1uer0729xtqvedwv6n7r2e04pyqahutv82annjmqa5uh68aezgg8qz64tga
