# Caddy reverse-proxy stack. Reads ~/caddy/.env (written by `ctdev configure
# caddy`) for CF_API_TOKEN, HOMELAB_DOMAIN, and HOMELAB_ACME_EMAIL.
services:
  caddy:
    build: .
    image: caddy-homelab:local
    container_name: caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN}
      - HOMELAB_DOMAIN=${HOMELAB_DOMAIN}
      - HOMELAB_ACME_EMAIL=${HOMELAB_ACME_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    # Lets Caddy reach the bare-metal Pi-hole (and other host services) at
    # host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Liveness via Caddy's local admin API (127.0.0.1:2019, on by default).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
