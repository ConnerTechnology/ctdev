# Pi-hole network-wide DNS ad blocker, run as a container with host networking
# so it owns the host's :53 (DNS) and :80 (web, reverse-proxied by Caddy on 443),
# alongside an Unbound recursive resolver (sidecar). Lists and config persist in
# ./etc-pihole; reproduce them with `ctdev pihole import` and `ctdev configure
# pihole`. Upstreams and listening mode are intentionally NOT set here so that
# `ctdev configure pihole` owns them (persisted in ./etc-pihole). Optional
# per-node values (TZ, admin password) come from ./.env.
services:
  # Recursive, DNSSEC-validating resolver. Bridge container exposed only on the
  # host loopback, so the host-networked Pi-hole reaches it at 127.0.0.1#5335
  # (set that as the upstream via `ctdev configure pihole`) but the LAN cannot.
  unbound:
    container_name: unbound
    image: klutchell/unbound:latest
    ports:
      - "127.0.0.1:5335:53/udp"
      - "127.0.0.1:5335:53/tcp"
    restart: unless-stopped

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    network_mode: host
    depends_on:
      - unbound
    environment:
      - TZ=${TZ:-Etc/UTC}
      - FTLCONF_webserver_port=80o,[::]:80o
      - FTLCONF_misc_etc_dnsmasq_d=true
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:-}
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - SYS_NICE
      - NET_ADMIN
    restart: unless-stopped
