# ctdev-managed Unbound tuning for the Pi-hole stack. Bind-mounted into the
# image's include dir (/etc/unbound/custom.conf.d/) as a single file so the
# image's baked-in private-domains.conf is preserved. Applied on (re)start.
#
# Symptom this addresses: rare bursts of FTL warnings
#   "TCP connection failed while receiving payload length from upstream
#    (Connection prematurely closed by remote server)"  (127.0.0.1#5335)
# Cause: answers larger than edns-buffer-size (1232) are truncated, so FTL
# retries over TCP. Stock Unbound runs single-threaded with incoming-num-tcp=10,
# so a momentary burst of concurrent TCP fall-backs overflows the cap and the
# overflow connections are closed. More threads + a much larger TCP backlog
# absorb the bursts.
server:
    num-threads: 2
    so-reuseport: yes
    incoming-num-tcp: 100
    outgoing-num-tcp: 100
