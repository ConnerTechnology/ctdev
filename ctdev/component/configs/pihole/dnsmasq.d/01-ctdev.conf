# ctdev-managed dnsmasq tuning for the Pi-hole stack. Deployed to
# ~/pihole/etc-dnsmasq.d/ and read by pihole-FTL (FTLCONF_misc_etc_dnsmasq_d=true).
# Applied when the Pi-hole container (re)starts.

# Raise the cap on concurrent forwarded queries (dnsmasq default: 150). A
# recursive upstream (Unbound) holds a forward slot per in-flight query longer
# than a fast public resolver does, so a burst can transiently exhaust the
# default and log "Maximum number of concurrent DNS queries reached". 500 gives
# ample headroom at negligible cost on a Pi.
dns-forward-max=500
