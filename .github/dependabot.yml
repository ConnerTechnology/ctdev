# Dependabot version updates.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# commit-message.prefix gets a colon appended by Dependabot, giving the repo's `type: description` form.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /ctdev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
