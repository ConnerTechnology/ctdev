name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Group by ref, not SHA: a release pushes main and a tag at the same commit,
# and with a SHA-keyed group whichever run starts first gets cancelled — when
# that's the tag run, the release never builds (bit v12.4.0). Per-ref groups
# keep branch and tag runs independent, while rapid successive pushes to the
# same branch still supersede each other.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; write perms are granted per-job where actually needed.
permissions:
  contents: read

jobs:
  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check syntax
        run: |
          for f in install.sh uninstall.sh devcontainer.sh; do
            bash -n "$f" || exit 1
          done

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh devcontainer.sh

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ctdev/go.mod
          cache-dependency-path: ctdev/go.sum

      - name: Run tests
        working-directory: ctdev
        run: go test -race ./...

      - name: Vet
        working-directory: ctdev
        run: go vet ./...

      - name: Build
        working-directory: ctdev
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Test --help flag
        working-directory: ctdev
        run: ./ctdev --help

      - name: Test --version flag
        working-directory: ctdev
        run: ./ctdev --version

      - name: Test info command
        working-directory: ctdev
        run: ./ctdev info

      - name: Test dry-run install
        working-directory: ctdev
        run: ./ctdev --dry-run install jq

  test-ubuntu:
    name: Test on Ubuntu ${{ matrix.ubuntu-version }}
    needs: go-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu-version: ['22.04', '24.04']
      fail-fast: false

    container:
      image: ubuntu:${{ matrix.ubuntu-version }}

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git sudo curl

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ctdev/go.mod
          cache-dependency-path: ctdev/go.sum

      - name: Build ctdev
        working-directory: ctdev
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Install zsh component
        working-directory: ctdev
        run: ./ctdev --force install zsh

      - name: Verify zsh installation
        run: |
          command -v zsh || exit 1
          [ -d ~/.oh-my-zsh ] || exit 1

      - name: Install jq component
        working-directory: ctdev
        run: ./ctdev --force install jq

      - name: Verify jq installation
        run: command -v jq || exit 1

      - name: Test info command
        working-directory: ctdev
        run: ./ctdev info

  test-macos:
    name: Test on macOS
    needs: go-test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ctdev/go.mod
          cache-dependency-path: ctdev/go.sum

      - name: Build ctdev
        working-directory: ctdev
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Test CLI commands
        working-directory: ctdev
        run: |
          ./ctdev --version
          ./ctdev install --help
          ./ctdev info

      - name: Install jq component
        working-directory: ctdev
        run: ./ctdev install jq

      - name: Verify jq installation
        run: command -v jq || exit 1

  build-release:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [shellcheck, go-test, test-ubuntu, test-macos]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Guard against tag/VERSION drift — otherwise the built binary's
      # --version output silently disagrees with the release tag.
      - name: Verify VERSION matches tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          want="v$(cat VERSION)"
          if [ "$want" != "$TAG_NAME" ]; then
            echo "VERSION file says $want but tag is $TAG_NAME — refusing to release a mismatched binary."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ctdev/go.mod
          cache-dependency-path: ctdev/go.sum

      - name: Build binary
        working-directory: ctdev
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev-${{ matrix.os }}-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ctdev-${{ matrix.os }}-${{ matrix.arch }}
          path: ctdev/ctdev-${{ matrix.os }}-${{ matrix.arch }}

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, replacing with new build"
            gh release delete "$TAG_NAME" --yes
          fi
          chmod +x dist/ctdev-*
          # Publish a checksums file so install.sh can verify the binary it
          # downloads (defends the self-update path against a tampered asset).
          ( cd dist && sha256sum ctdev-* > SHA256SUMS )
          gh release create "$TAG_NAME" dist/ctdev-* dist/SHA256SUMS \
            --title "$TAG_NAME" \
            --generate-notes
