name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# New pushes supersede earlier runs on the same ref. PR test-merge refs are
# independent of main and of one another.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  plan:
    name: Select checks
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      # Every main push gets full verification for the release workflow. Only
      # prose-only and VERSION-only PRs skip the platform jobs.
      - id: scope
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if git diff --quiet --no-renames "$PR_BASE" HEAD -- . \
              ':!README.md' ':!TROUBLESHOOTING.md' ':!AGENTS.md' ':!VERSION'; then
              full=false
            else
              status=$?
              [[ "$status" == 1 ]] || exit "$status"
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check syntax
        run: |
          for f in install.sh uninstall.sh devcontainer.sh scripts/check-guidance.sh \
            scripts/checks.sh scripts/install-test-restic.sh scripts/ci-go-test.sh; do
            bash -n "$f" || exit 1
          done

      - name: Check version format
        shell: bash
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error file=VERSION::Expected MAJOR.MINOR.PATCH"
            exit 1
          fi

      - name: Run ShellCheck
        run: |
          shellcheck install.sh uninstall.sh devcontainer.sh scripts/check-guidance.sh \
            scripts/checks.sh scripts/install-test-restic.sh scripts/ci-go-test.sh

      # AGENTS.md is a claim about the tree that nothing else compiles — this holds it to
      # paths that exist, and the repo to no real tailnet names.
      - name: Check guidance
        run: scripts/check-guidance.sh

      # Entire's checkpoints hold whole agent transcripts and belong in the private
      # ConnerTechnology/ctdev-entire repo (.entire/settings.json). This repo is public, so
      # fail if one ever lands here.
      - name: No checkpoints on this repo
        run: |
          refs=$(git ls-remote origin 'refs/entire/*' 'refs/heads/entire/*')
          if [ -n "$refs" ]; then
            echo "Entire checkpoint refs are on this public repo; delete them:" >&2
            echo "$refs" >&2
            exit 1
          fi

  powershell-lint:
    name: Windows installer and doctor
    needs: plan
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Parse the Windows installer and check its documented parameter contract.
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

      - name: Check for parameter binding
        shell: pwsh
        run: |
          # The documented `& ([scriptblock]::Create((irm ...))) -Doctor`
          # invocation only works if the script declares its parameters.
          $ast = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$null)
          if (-not $ast.ParamBlock) { throw "install.ps1 must declare a param() block" }
          $names = $ast.ParamBlock.Parameters.Name.VariablePath.UserPath
          foreach ($required in @('Doctor', 'DoctorArgs')) {
            if ($names -notcontains $required) { throw "install.ps1 is missing the -$required parameter" }
          }
          Write-Host "install.ps1 exposes the expected parameters"

      - name: Set up Go
        if: needs.plan.outputs.full == 'true'
        uses: ./.github/actions/setup-ctdev-go

      - name: Smoke-test Windows doctor
        if: needs.plan.outputs.full == 'true'
        working-directory: ctdev
        shell: pwsh
        timeout-minutes: 5
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'doctor.md'
          go run . doctor --network --redact "--report=$report" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $markdown = Get-Content -Raw -LiteralPath $report
          if ($markdown -notmatch '(?m)^# Diagnostic report ' -or
              $markdown -notmatch '\(windows/[^)]+\)' -or
              $markdown -notmatch '(?m)^## What needs attention') {
            throw "doctor did not produce a Windows diagnostic report"
          }

  go-test:
    name: Go tests on Linux
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-ctdev-go

      - name: Cache the pinned restic archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ctdev-restic
          key: test-restic-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-test-restic.sh') }}

      - name: Install and verify restic
        run: |
          scripts/install-test-restic.sh "$RUNNER_TEMP/ctdev-restic" "$RUNNER_TEMP/ctdev-tools"
          echo "$RUNNER_TEMP/ctdev-tools" >> "$GITHUB_PATH"

      # Six workers on the four-core runner keep more tests moving while
      # others wait on restic. Keep the same race and shuffle flags.
      - name: Run race tests and vet
        run: scripts/ci-go-test.sh -parallel=6 ./...

  cross-vet:
    name: Vet cross-platform source and tests
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-ctdev-go
        with:
          cache-dependency-path: ctdev/go.mod

      # Windows only ships doctor. Vet every target to catch platform-specific
      # source and test errors even though the release cross-links only the CLI.
      - name: Vet cross-platform source and tests
        working-directory: ctdev
        shell: bash
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done

  linux-build:
    name: Build Linux smoke-test binary
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-ctdev-go
        with:
          # This fast job finishes first. Give it a separate key so it cannot
          # claim the immutable cache used for race builds and cross-platform vet.
          cache-dependency-path: |
            ctdev/go.mod
            ctdev/go.sum

      - name: Build and exercise the CLI
        working-directory: ctdev
        env:
          CGO_ENABLED: '0'
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .
          ./ctdev --help
          ./ctdev --version
          ./ctdev info
          ./ctdev --dry-run install jq

      - name: Upload the binary for both Ubuntu smoke tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-smoke-binary
          path: ctdev/ctdev
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  test-ubuntu:
    name: Test on Ubuntu ${{ matrix.ubuntu-version }}
    needs: linux-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ubuntu-version: ['22.04', '24.04']

    container:
      image: ubuntu:${{ matrix.ubuntu-version }}

    steps:
      - name: Download the smoke-test binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-smoke-binary

      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git sudo curl ca-certificates
          chmod +x ctdev

      - name: Exercise component installation and the CLI
        run: |
          ./ctdev --force install zsh
          command -v zsh
          test -d ~/.oh-my-zsh
          ./ctdev --force install jq
          command -v jq
          ./ctdev info

  test-macos:
    name: Test on macOS (${{ matrix.suite }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: backup
            cache-dependency-path: ctdev/go.sum
          - suite: application
            cache-dependency-path: |
              ctdev/go.mod
              ctdev/go.sum

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-ctdev-go
        with:
          cache-dependency-path: ${{ matrix.cache-dependency-path }}

      - name: Cache the pinned restic archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ctdev-restic
          key: test-restic-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/install-test-restic.sh') }}

      - name: Install and verify restic
        run: |
          scripts/install-test-restic.sh "$RUNNER_TEMP/ctdev-restic" "$RUNNER_TEMP/ctdev-tools"
          echo "$RUNNER_TEMP/ctdev-tools" >> "$GITHUB_PATH"

      # Give maintenance integration tests to the faster application job.
      # Use the same pattern for -run and -skip so the macOS jobs together
      # still cover every backup test, including tests added to other files.
      - name: Select real-restic maintenance tests
        id: maintenance
        shell: bash
        run: |
          names=$(sed -n -E 's/^func (Test[[:alnum:]_]+)\(.*/\1/p' ctdev/backup/maintenance_test.go)
          if [[ -z "$names" ]]; then
            echo "::error::No backup maintenance tests found"
            exit 1
          fi
          echo "pattern=^($(paste -sd '|' - <<< "$names"))$" >> "$GITHUB_OUTPUT"

      - name: Run backup race tests and vet
        if: matrix.suite == 'backup'
        env:
          MAINTENANCE_TESTS: ${{ steps.maintenance.outputs.pattern }}
        run: scripts/ci-go-test.sh ./backup "-skip=$MAINTENANCE_TESTS"

      - name: Run application race tests and vet
        if: matrix.suite == 'application'
        run: scripts/ci-go-test.sh --exclude=./backup

      - name: Run maintenance race tests and vet
        if: matrix.suite == 'application'
        env:
          MAINTENANCE_TESTS: ${{ steps.maintenance.outputs.pattern }}
        run: scripts/ci-go-test.sh ./backup "-run=$MAINTENANCE_TESTS"

      - name: Build ctdev
        if: matrix.suite == 'application'
        working-directory: ctdev
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Test CLI commands
        if: matrix.suite == 'application'
        working-directory: ctdev
        run: |
          ./ctdev --version
          ./ctdev install --help
          ./ctdev info

      # Exercises the Homebrew scan path end to end (brew outdated --json=v2).
      - name: Check for updates
        if: matrix.suite == 'application'
        working-directory: ctdev
        run: ./ctdev update --check

      - name: Install jq component
        if: matrix.suite == 'application'
        working-directory: ctdev
        run: ./ctdev install jq

      - name: Verify jq installation
        if: matrix.suite == 'application'
        run: command -v jq || exit 1

  required:
    name: Required CI
    if: always()
    needs: [plan, shellcheck, powershell-lint, go-test, cross-vet, linux-build, test-ubuntu, test-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Check that all selected jobs passed
        shell: bash
        env:
          FULL: ${{ needs.plan.outputs.full }}
          PLAN: ${{ needs.plan.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          POWERSHELL: ${{ needs.powershell-lint.result }}
          LINUX_TEST: ${{ needs.go-test.result }}
          CROSS_VET: ${{ needs.cross-vet.result }}
          LINUX_BUILD: ${{ needs.linux-build.result }}
          UBUNTU: ${{ needs.test-ubuntu.result }}
          MACOS: ${{ needs.test-macos.result }}
        run: |
          if [[ "$PLAN" != success || "$SHELLCHECK" != success || "$POWERSHELL" != success ]]; then
            echo "::error::Planning or lint did not pass (plan=$PLAN, shell=$SHELLCHECK, powershell=$POWERSHELL)"
            exit 1
          fi
          case "$FULL" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "::error::Missing or invalid test plan"; exit 1 ;;
          esac
          if [[ "$LINUX_TEST" != "$expected" || "$CROSS_VET" != "$expected" ||
                "$LINUX_BUILD" != "$expected" ||
                "$UBUNTU" != "$expected" || "$MACOS" != "$expected" ]]; then
            echo "::error::Expected $expected (linux tests=$LINUX_TEST, cross vet=$CROSS_VET, linux build=$LINUX_BUILD, ubuntu=$UBUNTU, macos=$MACOS)"
            exit 1
          fi
