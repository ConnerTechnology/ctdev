name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check syntax
        run: |
          for f in install.sh uninstall.sh devcontainer.sh; do
            bash -n "$f" || exit 1
          done

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh devcontainer.sh

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ctdev/go.mod

      - name: Run tests
        working-directory: ctdev
        run: go test ./...

      - name: Vet
        working-directory: ctdev
        run: go vet ./...

      - name: Build
        working-directory: ctdev
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Test --help flag
        working-directory: ctdev
        run: ./ctdev --help

      - name: Test --version flag
        working-directory: ctdev
        run: ./ctdev --version

      - name: Test info command
        working-directory: ctdev
        run: ./ctdev info

      - name: Test dry-run install
        working-directory: ctdev
        run: ./ctdev --dry-run install jq

  test-ubuntu:
    name: Test on Ubuntu ${{ matrix.ubuntu-version }}
    needs: go-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu-version: ['22.04', '24.04']
      fail-fast: false

    container:
      image: ubuntu:${{ matrix.ubuntu-version }}

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git sudo curl

      - name: Install Go
        run: |
          curl -fsSL "https://go.dev/dl/go1.24.2.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          tar -C /usr/local -xzf /tmp/go.tar.gz
          rm /tmp/go.tar.gz

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build ctdev
        working-directory: ctdev
        run: |
          export PATH="/usr/local/go/bin:$PATH"
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Install zsh component
        working-directory: ctdev
        run: ./ctdev --force install zsh

      - name: Verify zsh installation
        run: |
          command -v zsh || exit 1
          [ -d ~/.oh-my-zsh ] || exit 1

      - name: Install jq component
        working-directory: ctdev
        run: ./ctdev --force install jq

      - name: Verify jq installation
        run: command -v jq || exit 1

      - name: Test info command
        working-directory: ctdev
        run: ./ctdev info

  test-macos:
    name: Test on macOS
    needs: go-test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ctdev/go.mod

      - name: Build ctdev
        working-directory: ctdev
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Test CLI commands
        working-directory: ctdev
        run: |
          ./ctdev --version
          ./ctdev install --help
          ./ctdev info

      - name: Install jq component
        working-directory: ctdev
        run: ./ctdev --force install jq

      - name: Verify jq installation
        run: command -v jq || exit 1
