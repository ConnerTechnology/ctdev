name: Test Dotfiles

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check all shell scripts
        run: |
          find . -name "*.sh" -type f | while read -r file; do
            bash -n "$file" || exit 1
          done

  shellcheck:
    name: ShellCheck Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck on lib/
        run: shellcheck lib/*.sh

      - name: Run ShellCheck on cmds/
        run: shellcheck cmds/*.sh

      - name: Run ShellCheck on component installers
        run: shellcheck components/*/install.sh

  go-test:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ctdev/go.mod

      - name: Run tests
        working-directory: ctdev
        run: go test ./...

      - name: Build
        working-directory: ctdev
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Test --help flag
        working-directory: ctdev
        run: ./ctdev --help

      - name: Test --version flag
        working-directory: ctdev
        run: ./ctdev --version

      - name: Test info command
        working-directory: ctdev
        run: ./ctdev info

      - name: Test dry-run install
        working-directory: ctdev
        run: ./ctdev --dry-run install jq

  test-ubuntu:
    name: Test on Ubuntu ${{ matrix.ubuntu-version }}
    needs: go-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ubuntu-version: ['22.04', '24.04']
      fail-fast: false

    container:
      image: ubuntu:${{ matrix.ubuntu-version }}

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git sudo curl

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install zsh component
        run: bash components/zsh/install.sh

      - name: Verify zsh installation
        run: |
          command -v zsh || exit 1
          [ -d ~/.oh-my-zsh ] || exit 1
          [ -d ~/.zsh/pure ] || exit 1

      - name: Verify config files
        run: |
          [ -f ~/.zshrc ] || exit 1
          [ -f ~/.oh-my-zsh/custom/aliases.zsh ] || exit 1
          [ -f ~/.oh-my-zsh/custom/exports.zsh ] || exit 1

      - name: Install git component
        run: bash components/git/install.sh --name "CI Test" --email "ci@test.com"

      - name: Verify git config
        run: |
          [ -f ~/.gitconfig ] || exit 1
          git config --global user.name | grep -q "CI Test" || exit 1
          git config --global user.email | grep -q "ci@test.com" || exit 1

      - name: Install jq component
        run: bash components/jq/install.sh

      - name: Verify jq installation
        run: command -v jq || exit 1

  test-macos:
    name: Test on macOS
    needs: go-test
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ctdev/go.mod

      - name: Build ctdev
        working-directory: ctdev
        run: |
          VERSION=$(cat ../VERSION)
          go build -ldflags "-X main.version=$VERSION" -o ctdev .

      - name: Test CLI commands
        working-directory: ctdev
        run: |
          ./ctdev --version
          ./ctdev install --help
          ./ctdev info

      - name: Install zsh component
        run: bash components/zsh/install.sh

      - name: Verify zsh installation
        run: |
          [ -d ~/.oh-my-zsh ] || exit 1
          [ -d ~/.zsh/pure ] || exit 1
          [ -f ~/.zshrc ] || exit 1

      - name: Install git component
        run: bash components/git/install.sh --name "CI Test" --email "ci@test.com"

      - name: Verify git config
        run: |
          [ -f ~/.gitconfig ] || exit 1
          git config --global user.name | grep -q "CI Test" || exit 1
          git config --global user.email | grep -q "ci@test.com" || exit 1
