name: Go vulnerability scan

on:
  schedule:
    - cron: '45 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ctdev-go
      - name: Scan the release platforms for reachable vulnerabilities
        working-directory: ctdev
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          status=0
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "::group::$os/$arch"
              GOOS="$os" GOARCH="$arch" govulncheck ./... || status=1
              echo "::endgroup::"
            done
          done
          exit "$status"
